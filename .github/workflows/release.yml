name: Release MissionBlipFix

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag and VERSION
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 ci/validate_release.py "$RELEASE_TAG")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes mono-devel libmono-cecil-private-cil
      - name: Build and test against .NET Framework 4.8
        run: bash ci/run.sh "$RUNNER_TEMP/mission-blip-fix"
      - name: Publish GitHub release with installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            "package/MissionBlipFix-${RELEASE_VERSION}.zip" \
            --verify-tag \
            --title "MissionBlipFix ${RELEASE_TAG}" \
            --generate-notes
